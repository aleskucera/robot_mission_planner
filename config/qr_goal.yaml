# qr_goal (qr_goal.launch): camera -> geo:lat,lon -> /qr_goal/goal (GeoPointStamped,
# read by road_follower).
# The Odin's camera (/odin1/image/compressed, jpeg, ~27 Hz) is the QR camera; the Basler
# (/camera/image_color/compressed) is a backup that is not mounted at the moment.
/**:
  ros__parameters:
    image_topic: "/odin1/image/compressed"
    image_transport: "compressed"   # compressed | raw
    process_rate: 4.0               # Hz: decode at most this often
    confirm_frames: 2               # consecutive frames before a goal
    republish_after_s: 30.0         # same code again only after this
    goal_topic: "/qr_goal/goal"
    goal_frame_id: "wgs84"
    text_topic: "~/text"            # manual entry, see qr_goal_send
    detections_topic: "~/detections"
    publish_annotated: false        # ~/image_annotated for rqt
    enabled: true                   # ~/enable (SetBool) toggles it
