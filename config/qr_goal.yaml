# QR camera -> GeoPointStamped goal (for road_follower)
/**:
  ros__parameters:
    image_topic: "/odin1/image/compressed"
    image_transport: "compressed" # compressed | raw
    process_rate: 2.0 # Hz: decode at most this often
    decode_downscale: 2 # 1|2|4|8: decode frames smaller (less CPU, the code must look bigger)
    confirm_frames: 1 # consecutive frames before a goal (bag detections are rarely consecutive)
    # Cooldown before re-publishing same code (s)
    republish_after_s: 10.0
    goal_topic: "/qr_goal/goal"
    goal_frame_id: "wgs84"
    text_topic: "~/text" # manual entry, see qr_goal_send
    detections_topic: "~/detections"
    publish_annotated: false # ~/image_annotated for rqt
    enabled: true # ~/enable (SetBool) toggles it
