# Fixposition fusion status overlay (node only subscribes, does not drive robot)
/**:
  ros__parameters:
    # FP_A-ODOMSTATUS from the fixposition driver ("" = panel stays on "no data")
    odomstatus_topic: "/fixposition/fpa/odomstatus"
    # Timeout [s] before the sensor shows as silent
    stale_timeout: 3.0

    # Panel look. Sizes are in pixels of the 3D render panel. The panel is two lines:
    # a headline (fusion state) and a detail line (GNSS, corrections, IMU, wheels).
    text_size: 12.0
    panel_width: 540
    panel_max_chars: 54 # lines are truncated rather than wrapped
    panel_margin: 8
    panel_bg_alpha: 0.55
    # Bottom right: mission_hud owns both top corners.
    panel_align_right: true
    panel_align_bottom: true
    font: "DejaVu Sans Mono"
    markup: true # false if a future rviz build draws the markup verbatim
    rate: 4.0 # Hz
