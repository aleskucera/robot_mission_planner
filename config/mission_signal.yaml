# Translate road_follower events into audio signals
/**:
  ros__parameters:
    event_topic: "/road_follower/event" # latched String from road_follower
    # Backend: speak (text-to-speech), aplay (wav files), log, or gpio
    backend: "speak"
    # Speak backend topics by level ("" = off)
    speak_info_topic: "/speak/info"
    speak_warn_topic: "/speak/warn"
    speak_error_topic: "/speak/err"
    player_command: "aplay -q" # aplay backend: the file path is appended
    sound_dir: "" # aplay backend: empty = the package data/ directory
    # Ignore first message within this time (s) to drop old latched events (0 = off)
    ignore_latched_s: 1.0

    # Spoken text per event. Empty = off, unlisted = logged only.
    speech:
      GOAL: "Goal accepted"
      ROUTE: "Route planned"
      START: "Starting"
      ARRIVED: "Arrived"
      CONTINUE: "Continuing" # first goal after an arrival = the continue signal
      ABORT: "Aborted"
      PLAN_FAILED: "Planning failed"
      IDLE: "Waiting for a goal"

    # Speak level (info/warn/error) per event. Unlisted = info.
    speech_level:
      GOAL: "info"
      ROUTE: "info"
      START: "info"
      ARRIVED: "info"
      CONTINUE: "info"
      ABORT: "warn"
      PLAN_FAILED: "error"
      IDLE: "info"

    # Audio files for aplay backend (relative to sound_dir or absolute)
    sounds:
      GOAL: "goal.wav"
      ROUTE: "route.wav"
      START: "start.wav"
      ARRIVED: "arrived.wav"
      CONTINUE: "continue.wav"
      ABORT: "abort.wav"
      PLAN_FAILED: "plan_failed.wav"
      IDLE: "idle.wav"
