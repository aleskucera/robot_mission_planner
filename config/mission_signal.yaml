# mission_signal (mission_signal.launch): road_follower mission events -> a signal a
# bystander notices. Robotour wants the robot to indicate its arrival, and homologation
# tests the signalization and the continue of the trial (review R1).
/**:
  ros__parameters:
    event_topic: "/road_follower/event" # latched String from road_follower
    # speak: publish the sentence for helhest_bringup nodes/speak.py -> sound_play (needs
    # the NUC sound.launch running); aplay: play a wav; log: only log; gpio: placeholder
    # for the light backend (see _signal_gpio in mission_signal.py).
    backend: "speak"
    speak_topic: "/speak/info" # speak backend: /speak/info | /speak/warn | /speak/err
    player_command: "aplay -q" # aplay backend: the file path is appended
    sound_dir: "" # aplay backend: empty = the package data/ directory
    # The event topic is latched, and std_msgs/String carries no stamp: the first message
    # received within this many seconds of the start is taken for the previous run's latched
    # event and dropped (0 = signal everything, including that one).
    ignore_latched_s: 1.0

    # What to say for each event, keyed by the event name (the part before the first ":").
    # An empty value switches an event off; an event that is not listed is only logged.
    speech:
      GOAL: "Goal accepted"
      ROUTE: "Route planned"
      START: "Starting"
      ARRIVED: "Arrived"
      CONTINUE: "Continuing" # first goal after an arrival = the continue signal
      ABORT: "Aborted"
      PLAN_FAILED: "Planning failed"
      IDLE: "Waiting for a goal"

    # The same table for the aplay backend: file names relative to sound_dir, or absolute
    # paths. A missing file is warned about once and then ignored.
    sounds:
      GOAL: "goal.wav"
      ROUTE: "route.wav"
      START: "start.wav"
      ARRIVED: "arrived.wav"
      CONTINUE: "continue.wav"
      ABORT: "abort.wav"
      PLAN_FAILED: "plan_failed.wav"
      IDLE: "idle.wav"
