# Operator view overlays (node only subscribes, does not drive robot)
/**:
  ros__parameters:
    # Frames the HUD measures route progress in (same defaults as road_follower).
    map_frame: "FP_ENU0"
    robot_frame: "base_link"

    # Input topics (empty topic leaves panel line empty)
    follower_state_topic: "/road_follower/state"
    follower_event_topic: "/road_follower/event"
    commander_state_topic: "/crl_commander/state"
    planner_status_topic: "/route_planner/status"
    # Route and source topics from road_follower
    route_path_topic: "/road_follower/route_path"
    route_source_topic: "/road_follower/route_source"
    # Fallback route for older bags before road_follower published its route
    planner_route_path_topic: "/route_planner/route_path"
    qr_goal_topic: "/qr_goal/goal"
    estop_topic: "/estop_active"
    battery_topic: "/battery_state"
    temperature_topic: "/temperatures"
    gps_fix_topic: "/fixposition/odometry_llh"
    # Control source toggle: button 10 held = RC override, released = ROS
    joy_topic: "/joy"
    rc_override_button: 10
    # Velocity display: odometry (measured) and cmd_vel (commanded)
    odom_topic: "/odom_2d"
    cmd_vel_topic: "/cmd_vel"
    # Timeout [s] before inputs show as unknown/silent
    stale_timeout: 1.0

    # Panel look. Sizes are in pixels of the 3D render panel.
    text_size: 12.0
    # Panel dimensions. Must fit 3D view width (~1220 px) to avoid overlap.
    panel_width: 620
    panel_max_chars: 60 # lines are truncated rather than wrapped
    status_panel_width: 470
    status_panel_max_chars: 46
    panel_margin: 8
    panel_bg_alpha: 0.55
    font: "DejaVu Sans Mono"
    markup: true # false if a future rviz build draws the markup verbatim
    rate: 4.0 # Hz
    # Optional last line of the mission panel, free text. "" = no line.
    hint: ""

    # Placeholder body box when /robot_description is unavailable
    robot_body: false
    robot_body_size: [0.9, 0.7, 0.35]
    robot_body_offset_z: 0.25
    robot_body_color: [0.25, 0.6, 1.0, 0.5]
