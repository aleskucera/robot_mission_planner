# mode: road -- follow detected road only. No route/intersections/goal.
/**:
  ros__parameters:
    mode: "road"
    file: ""
    # No route to measure against; fall back to plain carrot
    road_goal_source: "carrot"
    road_goal_max_route_offset: 0.0
    # Disable fallbacks and final approach (no route)
    road_path_timeout: 0.0
    final_approach_distance: 0.0
