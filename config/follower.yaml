# Follower base parameters (follower.launch) overridden by config/modes/<mode>.yaml.
# Launch arguments override mode, gps_file, nav_backend, road_goal_source, carrot_topic.
/**:
  ros__parameters:
    # Operating mode:
    #   road_gps: follow road, use route at intersections/fallback/final approach
    #   gps: follow route waypoints only
    #   road: follow road only (no route/goal)
    #   gps_shift: route waypoints one at a time, moved onto the segmented road
    mode: "road_gps"

    # Navigation backend: "commander", "nav2", or "follow_path" (road mode only)
    nav_backend: "commander"
    use_utm: true # nav2 only: UTM goals vs lat/lon goals
    follow_path_action: "follow_path" # follow_path only: the nav2 FollowPath action
    follow_path_spacing: 0.25 # follow_path only: m between the synthetic path poses

    # Frames (distances measured in map_frame, GPX in earth_frame)
    map_frame: "FP_ENU0"
    robot_frame: "base_link"
    earth_frame: "FP_ECEF"
    utm_frame: "utm" # nav2 + use_utm only

    # Topics / services
    road_points_topic: "/predicted_path_ls" # path_centerline/predict_path
    intersections_topic: "/intersections" # map_data/osm_cloud
    gps_fix_topic: "/fixposition/odometry_llh"
    goal_waypoint_topic: "/goal_waypoint"
    goal_sequence_topic: "/goal_sequence"
    commander_state_topic: "/crl_commander/state" # crl_commander publishes ~/state
    state_topic: "~/state"
    event_topic: "~/event"
    home_topic: "~/home" # latched GeoPointStamped: the service area
    active_intersection_topic: "~/active_intersection"
    route_path_topic: "~/route_path" # latched Path: the route being followed (file or planned)
    route_source_topic: "~/route_source" # latched String: "file <path>" | "route_planner" | ""
    abort_service: "~/abort" # std_srvs/Trigger: stop the leg, go IDLE
    switch_mode_service: "/crl_commander/switch_mode"
    configure_sequence_service: "/crl_commander/configure_sequence_mode"
    markers_topic: "gps_waypoints_markers"

    # Visualisation: diameter of a route waypoint sphere on gps_waypoints_markers, m
    waypoint_marker_scale: 0.8

    # Route file (GPX/YAML). Empty = mission mode (wait for QR goals). Ignored in road mode.
    file: ""
    start: 0 # start index of the waypoints
    reverse: false
    loop: false # file routes only; mission routes never loop

    # Thresholds
    intersection_enter_threshold: 5.0 # m: switch ROAD -> GPS
    intersection_exit_threshold: 6.0 # m: from every intersection to switch back
    # Max distance (m) to planned route for an intersection to count (0 = all count)
    intersection_route_max_offset: 3.0
    gps_goal_threshold: 5.0 # m: waypoint / road goal reached
    lookahead_sync_window: 15 # waypoints searched for the closest one
    road_goal_update_distance: 1.0 # m: min shift of the road goal to re-send it
    require_waypoint_reached_to_exit_gps: false
    gps_exit_require_passed: true # leave GPS only after passing the intersection along the route
    gps_exit_min_waypoints: 0 # waypoints to advance before leaving GPS mode
    # Waypoints per sequence (0 = whole remaining route)
    gps_sequence_window: 0
    # ROAD <-> GPS hand-over behavior
    stop_between_modes: false
    transition_delay: 0.0
    # Commander restart detection timeout (s) (0 = off)
    commander_restart_gap: 5.0
    # Waypoint frame -> map_frame transform update period (0 = startup only)
    waypoint_tf_recheck_period: 10.0

    # Road goal source: carrot (hull center), path (predicted), or route (carrot stretched along route)
    road_goal_source: "route" # carrot | path | route
    carrot_topic: "/cloud_hull_center_marker"
    carrot_type: "marker" # marker | path
    road_goal_min_ahead: 4.0 # m: never send a closer goal
    road_goal_max_ahead: 12.0 # m: farther = projection artefact
    road_goal_smoothing: 0.8 # carrot: 0 = raw, 0.8 = damped
    road_goal_reached_distance: 2.5 # m: forget the active road goal

    # Project robot/carrot onto route and add stretch distance along it, carrying over offset
    route_stretch_distance: 2.0 # m along the route past the robot/carrot projection
    # The hull-centre carrot follows the robot's heading more than the road centre, so
    # carrying all of its offset turns heading error into goal offset (2026-09-14 bags).
    route_lateral_gain: 0.3 # how much of the carrot's offset is carried over
    route_stretch_max_turn: 45.0 # deg: do not stretch past a sharper corner (0 = off)
    route_projection_window: 10 # waypoints searched around the current index (0 = all)
    # true = drive blindly along route offset when no carrot arrives
    route_goal_without_carrot: false

    # Route shift (mode gps_shift): each waypoint moved by the offset between the route and the
    # road centre build_map sees around the robot (translation only); unshifted at intersections
    road_map_topic: "/road_map_2" # build_map's road map in map_frame
    road_map_cost_field: "cost" # centerline cost / 255, 0 = road centre (rgb reads 0 there)
    shift_radius: 2.5 # m around the robot
    shift_centre_cost_max: 0.086 # cost <= this is the centre (22/255, build_map centerline_value_max)
    shift_min_points: 15 # fewer centre cells = no measurement (the shift fades out)
    shift_max: 3.0 # m: longer shifts are clamped
    shift_smoothing: 0.8 # 0 = raw, 0.8 = damped
    shift_points_topic: "~/shift_centre_points" # Marker: the centre cells of the last fit

    # Mission (QR goal -> plan -> wait -> follow -> arrive -> idle)
    qr_goal_topic: "/qr_goal/goal" # GeoPointStamped from qr_goal
    # SetBool: pauses qr_goal's camera decoding while a leg runs, "" = leave it on
    qr_detection_service: "/qr_goal/enable"
    plan_route_action: "/route_planner/plan_route"
    plan_spacing: 3.0 # m between route waypoints
    plan_retries: 3
    plan_retry_delay: 5.0 # s
    # Failure reasons that skip retries
    plan_no_retry_reasons: ["snap_too_far"]
    plan_timeout: 60.0 # s per attempt
    start_delay: 5.0 # s: route received -> first command
    goal_reached_radius: 5.0 # m to the last waypoint = arrived
    arrival_index_window: 3 # waypoints from the end that count
    # Wait time (s) in ARRIVED before returning to IDLE
    arrived_hold: 2.0
    # Final approach (m): force GPS mode to the final waypoint (0 = off)
    final_approach_distance: 15.0
    # Ignore QR goals stamped older than this (s) before startup (0 = accept all)
    stale_goal_tolerance: 2.0
    # Ignore buffered goals closer than this (m) to the current leg's goal
    pending_goal_min_distance: 2.0
    # Directory for mission GPX and home position files
    mission_dir: "~/missions"

    # Road-goal sanity and failure handling
    road_goal_max_route_offset: 7.0 # m: reject road goals farther from the planned route (0 = off)
    # Relative limit margin over robot's own offset
    road_goal_route_offset_margin: 2.0
    road_goal_max_route_offset_hard: 10.0
    road_goal_reject_behind: true
    road_path_timeout: 5.0 # s without a road path -> GPS fallback (0 = off)
    stuck_fallback_to_gps: true # commander STUCK while road following -> GPS fallback
    service_timeout: 3.0 # s: commander service call watchdog
