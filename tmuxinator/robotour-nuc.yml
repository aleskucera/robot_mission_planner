# Robotour mission pipeline, NUC side.  Start with:  tmuxinator start robotour
#
#   QR code -> qr_goal -> /qr_goal/goal -> road_follower (mission mode) -> route_planner
#   -> follow the planned route: road following on the paths, GPS through intersections
#   -> ARRIVED -> idle, waiting for the next QR goal.
#
# This is the mission layer only. Start it *on top of* the two sessions that own the
# hardware and the driving stack:
#   tmuxinator start tmux-launch   # zenoh router, fixposition (FP_ECEF/FP_ENU0 + base_link)
#   tmuxinator start adam          # crl_commander, path follower, local planner, safety
# and on the jetson:
#   tmuxinator start robotour      # odin driver, cloud filters, path_centerline
#
# Source: robot_mission_planner/tmuxinator/robotour-nuc.yml (symlinked into ~/.tmuxinator).

name: robotour
root: /home/robot/workspaces/helhest_ws

startup_window: follower
# ~/.rosrc sets rmw_zenoh + the router endpoints and sources helhest_ws.
pre_window: export ROS_DISTRO=kilted; source ~/.rosrc

windows:
  # OSM map -> /intersections (FP_ENU0), the rings road_follower switches to GPS in, and
  # the /grid cloud for rviz. Loads the plain map: annotations are a planning-time thing.
  - map:
      panes:
        - |
          sleep 3
          ros2 launch map_data osm_cloud.launch.py mapdata_file:=kralovska_obora.mapdata

  # PlanRoute action server (/route_planner/plan_route): QR goal + our fix -> route on the
  # map's footways. preload=true builds the graph at startup, so a plan takes ~10 ms, and
  # every route is saved to ~/missions as GPX. annotations=auto merges
  # <map>.annotations.json when one sits next to the map (kralovska_obora has none;
  # stromovka.annotations.json deletes 838 ways -- use annotations:=none with that map).
  - planner:
      panes:
        - |
          sleep 3
          ros2 launch map_data route_planner.launch.py mapdata_file:=kralovska_obora.mapdata

  # Goal QR reader on the Odin camera (1600x1296 jpeg, decoded at 4 Hz): a geo:lat,lon
  # code seen twice in a row -> /qr_goal/goal. Codes are ignored unless the follower is
  # idle. Second pane: type the goal in by hand when the code is only on paper, or turn
  # the reader off while the robot is being carried past other codes.
  - qr:
      panes:
        - |
          sleep 3
          ros2 launch robot_mission_planner qr_goal.launch
        - |
          history -s 'ros2 run robot_mission_planner qr_goal_send "geo:50.1103476,14.4159857"'
          history -s 'ros2 service call /qr_goal/enable std_srvs/srv/SetBool "{data: false}"'
          echo "press Up: send a goal by hand / disable the reader"

  # The mission state machine: IDLE -> PLANNING -> 5 s pause -> ROAD/GPS -> ARRIVED -> IDLE.
  # Every state change is logged here as an EVENT line. Mission mode is the default (no
  # gps_file); pass gps_file:=<route.gpx> to replay a pre-planned route instead.
  # crl_commander lives in adam_ws, which is not chained under helhest_ws, and the follower
  # imports its SwitchMode/ConfigureSequenceMode services -- hence the extra source.
  # Road goals come from the per-frame hull centre (/cloud_hull_center_marker); the
  # alternatives are carrot_topic:=/map_hull_center_marker (accumulated map centre) and
  # road_goal_source:=path (the fitted /predicted_path_ls).
  - follower:
      panes:
        - |
          sleep 5
          source /home/robot/workspaces/adam_ws/install/setup.bash
          ros2 launch robot_mission_planner road_and_gps_follower.launch

  # Nothing records by itself. ./rec_robotour.sh is the mission bag (the pipeline's own
  # topics, which record_nuc.yaml does not list); ./rec.sh is the standard full bag.
  - record:
      panes:
        - |
          cd
          history -s ./rec.sh
          history -s ./rec_robotour.sh
          echo "press Up: ./rec_robotour.sh (mission bag) or ./rec.sh (full robot bag)"

  - shell:
      panes:
        - cd
